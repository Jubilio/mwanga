name: Android installer
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public HTTPS backend URL (no secrets)
        required: true
        type: string
      mode:
        description: Output (release and bundle require signing secrets)
        required: true
        default: debug
        type: choice
        options: [debug, release, bundle]
      version_code:
        description: Increasing Android version code
        required: true
        default: '1'
        type: string
      version_name:
        description: Android version name
        required: true
        default: '1.0.0'
        type: string
      play_track:
        description: Send the AAB to Google Play (bundle mode only; needs PLAY_SERVICE_ACCOUNT_JSON)
        required: true
        default: none
        type: choice
        options: [none, internal, alpha, beta, production]
      play_status:
        description: Play release status (use draft until the app is published once)
        required: true
        default: draft
        type: choice
        options: [draft, completed]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ inputs.api_url }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      MWANGA_VERSION_CODE: ${{ inputs.version_code }}
      MWANGA_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the obsolete 'tools' package, which no longer exists.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run check:i18n
      - name: Configure release signing
        if: inputs.mode != 'debug'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mwanga.jks"
          echo "MWANGA_KEYSTORE_PATH=$RUNNER_TEMP/mwanga.jks" >> "$GITHUB_ENV"
          echo "MWANGA_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MWANGA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MWANGA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Add Firebase config (native push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set; the app will build without native push."
          fi
      - run: chmod +x android/gradlew
      - name: Build Android
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: node scripts/android-build.mjs "$BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: mwanga-android-${{ inputs.mode }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
      - name: Check Google Play upload
        if: inputs.play_track != 'none'
        env:
          BUILD_MODE: ${{ inputs.mode }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test "$BUILD_MODE" = bundle || { echo "Google Play requires mode=bundle"; exit 1; }
          test -n "$PLAY_JSON" || { echo "Missing secret PLAY_SERVICE_ACCOUNT_JSON"; exit 1; }
      - name: Upload to Google Play
        if: inputs.play_track != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mwanga.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          releaseName: ${{ inputs.version_name }} (${{ inputs.version_code }})
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/mwanga.jks"
